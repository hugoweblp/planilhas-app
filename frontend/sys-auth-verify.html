<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Authorized Access Only</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #10b981;
            font-family: 'JetBrains Mono', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        .terminal-box {
            width: 100%;
            max-width: 500px;
            padding: 40px;
            text-align: left;
        }

        .prompt { margin-bottom: 20px; font-size: 0.9rem; opacity: 0.8; }

        input {
            background: none;
            border: none;
            border-bottom: 2px solid #10b981;
            color: #fff;
            font-family: inherit;
            font-size: 1.2rem;
            width: 100%;
            outline: none;
            padding: 10px 0;
            letter-spacing: 4px;
        }

        .status { margin-top: 20px; font-size: 0.8rem; height: 20px; }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 10;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(16, 185, 129, 0.1) 50%, rgba(0, 0, 0, 0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scan 3s linear infinite;
        }

        @keyframes scan {
            0% { bottom: 100%; }
            100% { bottom: -100%; }
        }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <div class="terminal-box">
        <div class="prompt">> ACCESS_TOKEN_REQUIRED [SECURITY_LEVEL_99]</div>
        <div class="prompt">> IDENTITY: [CLASSIFIED]</div>
        <div class="prompt">> INPUT MASTER KEY:</div>
        <input type="password" id="m-key" autofocus placeholder="••••••••••••">
        <div id="status" class="status"></div>
    </div>

    <script>
        const input  = document.getElementById('m-key');
        const status = document.getElementById('status');
        let locked = false;

        input.addEventListener('keypress', async (e) => {
            if (e.key !== 'Enter' || locked) return;
            locked = true;

            const key = input.value.trim();
            if (!key) { locked = false; return; }

            status.style.color = '#10b981';
            status.textContent = '> VERIFYING_ENCRYPTION...';

            try {
                const res  = await fetch('/api/internal/auth', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({ key })
                });
                const data = await res.json();

                if (data.success) {
                    status.style.color = '#fff';
                    status.textContent = `> ACCESS_GRANTED. BEM-VINDO, ${data.nome.toUpperCase()}.`;
                    setTimeout(() => window.location.href = 'sys-lib-v2.html', 1000);
                } else {
                    status.style.color = '#ff0000';
                    status.textContent = '> AUTH_FAILED: INVALID_KEY_SEQUENCE';
                    input.value = '';
                    locked = false;
                }
            } catch (err) {
                status.style.color = '#ff0000';
                status.textContent = '> CONNECTION_ERROR: SERVER_UNREACHABLE';
                locked = false;
            }
        });
    </script>
</body>
</html>
